services:
  database:
    container_name: calcom-db
    image: postgres:15-alpine
    restart: always
    volumes:
      - cal_db_data:/var/lib/postgresql/data
    env_file: .env
    environment:
      # Répétition minimale pour s'assurer que l'image PG les capte bien au 1er lancement
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    networks:
      - cal-internal
    deploy:
      resources:
        limits:
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    container_name: calcom-redis
    image: redis:7-alpine
    restart: always
    volumes:
      - cal_redis_data:/data
    networks:
      - cal-internal
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  calcom:
    container_name: calcom-web
    image: calcom.docker.scarf.sh/calcom/cal.diy
    restart: always
    networks:
      - cal-internal
      - web-network
    env_file: .env
    environment:
      # Surcharge stricte pour pointer vers le conteneur DB interne
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@calcom-db:5432/${POSTGRES_DB}
      - DATABASE_DIRECT_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@calcom-db:5432/${POSTGRES_DB}
    depends_on:
      - database
    deploy:
      resources:
        limits:
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  calcom-api:
    container_name: calcom-api
    # Cal.com requiert souvent de builder l'API v2 localement depuis leur repo. 
    # Le bloc build est conservé de façon minimaliste au cas où l'image pré-compilée ne suffise pas.
    build:
      context: .
      dockerfile: apps/api/v2/Dockerfile
    restart: always
    networks:
      - cal-internal
      - web-network
    env_file: .env
    environment:
      - NODE_ENV=production
      - API_PORT=8080 # On décale le port interne pour éviter tout conflit avec Caddy
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@calcom-db:5432/${POSTGRES_DB}
      - DATABASE_READ_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@calcom-db:5432/${POSTGRES_DB}
      - DATABASE_WRITE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@calcom-db:5432/${POSTGRES_DB}
      - DATABASE_DIRECT_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@calcom-db:5432/${POSTGRES_DB}
      - REDIS_URL=redis://calcom-redis:6379
    depends_on:
      - database
      - redis
    deploy:
      resources:
        limits:
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  cal-internal:
    driver: bridge # Isolateur réseau pour Redis et Postgres
  web-network:
    external: true # Connecté au Caddy Global

volumes:
  cal_db_data:
  cal_redis_data:
